plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '+'
}

def customProps = new Properties()
def propsFile = rootProject.file('gradle-secrets.properties')
if (propsFile.exists()) {
    propsFile.withInputStream { customProps.load(it) }
    customProps.each { key, value ->
        System.properties.setProperty(key as String, value as String)
    }
}

group = 'de.linusdev'
version = lutils_version

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    title = "lutils-gradle"
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation "de.linusdev:lutils:$lutils_version"
}

publishing {
    repositories {
        mavenLocal()
    }
}

gradlePlugin {
    website = 'https://www.linudev.de'
    vcsUrl = 'https://github.com/lni-dev/lutils.git'
    plugins {
        "lutils-gradle-constants" {
            id = 'de.linusdev.lutils.gradle.constants'
            displayName = 'lutils-gradle-constants'
            description = 'Gradle plugin to generate a java class containing constants defined in gradle.'
            tags.addAll('constants', 'utils', 'java')
            implementationClass = 'de.linusdev.lutils.gradle.LUtilsConstantsGradlePlugin'
        }
    }
}